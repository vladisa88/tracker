services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracking_test
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: test-only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tracking -d tracking_test']
      interval: 1s
      timeout: 3s
      retries: 30
