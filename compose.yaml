services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tracking -d tracking']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      DATABASE_URL: postgres://tracking:${POSTGRES_PASSWORD}@db:5432/tracking?sslmode=disable
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?Set OWNER_TELEGRAM_ID}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:?Set TELEGRAM_CLIENT_ID}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:?Set TELEGRAM_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
